<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2400" height="1400">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
