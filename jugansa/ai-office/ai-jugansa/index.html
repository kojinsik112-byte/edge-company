<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 주관사업부 오피스</title>
<style>
  :root{--bg:#1b1916;--fg:#f1e9d8;--mut:#b7ab96;--ok:#82cc8c;--bad:#e3876f;--card:#2a2621}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 16px;box-sizing:border-box}
  header{width:100%;max-width:1200px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:1px}
  header h1 small{color:var(--mut);font-weight:normal;margin-left:8px;font-size:12px}
  .st{padding:3px 10px;border-radius:999px;background:var(--card);color:var(--mut);font-size:12px}
  .st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
  .sp{flex:1}
  button{background:var(--card);color:var(--fg);border:1px solid #4a4238;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#3a342c}
  #wrap{width:100%;max-width:1200px;aspect-ratio:1200/720;position:relative}
  canvas{width:100%;height:100%;display:block;border-radius:6px;image-rendering:pixelated}
  #log{width:100%;max-width:1200px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <h1>AI 주관사업부 오피스 <small>엣지컴퍼니 · 입주박람회 주관사 입찰 · 오픈 플로어</small></h1>
  <span id="st" class="st">서버 확인 중</span>
  <span class="sp"></span>
  <button id="simBtn">시뮬레이션 시작</button>
  <button id="restBtn">모두 휴게실로</button>
</header>
<div id="wrap"><canvas id="c" width="1200" height="720"></canvas></div>
<div id="log">·</div>

<script>
// ───────── 오픈 플로어 배치 ─────────
// 위 = 작업대 7개(일이 흐르는 순서) · 오른쪽 = 본부장 책상 · 왼쪽 아래 = 대기 · 휴게 · 오른쪽 아래 = 단지 보드
const STATIONS = {
  scout:   {n:1, name:"개척",     sub:"공고 감시 · 신규 개척",   color:"#d9a53b"},
  analysis:{n:2, name:"착수분석", sub:"공고 · 단지 · 카페 · 손익", color:"#6fa3e8"},
  build:   {n:3, name:"제작",     sub:"제안서 · 제출서류",       color:"#7fd38a"},
  audit:   {n:4, name:"검증",     sub:"법정 · 독립 검수",        color:"#ee8d7a"},
  mail:    {n:5, name:"발송",     sub:"메일 · 보관함 · GIF",     color:"#c39ae8"},
  pt:      {n:6, name:"PT",       sub:"대본 · 예상 질문",        color:"#f0c35c"},
  retro:   {n:7, name:"결과·관제", sub:"결과 분석 · 마감",        color:"#6fd0c8"},
};
const ORDER = ["scout","analysis","build","audit","mail","pt","retro"];
const ST_Y = 150, ST_X0 = 60, ST_GAP = 136;          // 작업대 줄 (y = 캐릭터 발 위치)
ORDER.forEach((k,i)=>{ STATIONS[k].x = ST_X0 + i*ST_GAP; STATIONS[k].y = ST_Y; });
const BOSS_DESK = {x:1085, y:150};                     // 본부장 책상
const LOUNGE = {box:[40,300,560,690], seats:[]};     // 대기 · 휴게 (일 없는 사람은 여기)
for (let r=0;r<3;r++) for (let c=0;c<6;c++) LOUNGE.seats.push([90 + c*80, 420 + r*110]);
const BOARD = {box:[600,300,1160,690]};               // 단지 보드
const WALK_Y = 240;                                   // 작업대 ↔ 아래 영역 사이 통로
const SCALE = 0.5, WALK_SPEED = 100;
const SITE_STALE_MS = 30*60*1000;

// 팀 스프라이트: 작업대(단계)별로 다른 사람 그림을 쓴다 — 팀은 호출될 때 생기고 끝나면 퇴근한다
const SPRITE_OF = {scout:"scout", analysis:"analyst", build:"builder", audit:"auditor", mail:"mailer", pt:"coach", retro:"retro", office:"pmo"};
const SPRITES = ["boss","scout","analyst","builder","auditor","mailer","coach","retro","pmo"];

// ───────── 이미지 ─────────
const IMG = {};
function load(name, src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{IMG[name]=i;r();}; i.onerror=()=>r(); i.src=src; }); }
const assets = [];
for (const c of SPRITES) assets.push([c+"_stand",`static/c_${c}_stand.png`],[c+"_walk",`static/c_${c}_walk.png`]);

// ───────── 상태 ─────────
const chars = {};                                     // id → 캐릭터 (boss 는 고정, 팀은 agent_id 로 생겼다 사라짐)
function mk(id, sprite, name, x, y){ return chars[id] = {id, sprite, name, x, y, path:[], state:"idle", face:1, label:"", tag:"", bubble:null, bubbleUntil:0, hop:0, after:null, at:"lounge", leaveAt:0}; }
mk("boss", "boss", "총괄 본부장", BOSS_DESK.x, BOSS_DESK.y); chars.boss.at = "boss";
let firstPoll = true, activeStation = null, memos = [], lastSeq = 0, simTimer = null, connected = null, curSite = "";
const sites = {};                                     // 단지 약칭 → {stage, t, teams}
let boardRows = (typeof BOARD_SNAPSHOT !== "undefined") ? BOARD_SNAPSHOT : [];   // 현황판에서 읽은 마감 · PT (서버 /sites)
async function loadBoard(){ try{ const r = await fetch("/sites", {cache:"no-store"}); if (r.ok){ const j = await r.json(); if (j.sites && j.sites.length) boardRows = j.sites; } }catch(e){} setTimeout(loadBoard, 60000); }

function freeSeat(){ const used = new Set(Object.values(chars).map(c=>c.seatIdx)); for (let i=0;i<LOUNGE.seats.length;i++) if (!used.has(i)) return i; return LOUNGE.seats.length-1; }
function slot(st){ // 작업대 앞에 여러 명이 서는 자리 (왼쪽부터)
  const s = STATIONS[st], here = Object.values(chars).filter(c=>c.at===st && c.id!=="boss").length;
  return [s.x - 28 + (here%3)*28, s.y + 8 + Math.floor(here/3)*14];
}
function go(ch, target, at){
  // 작업대 줄(y 150) ↔ 아래 영역은 통로(y 240)를 거쳐 간다. 같은 줄이면 직진.
  const pts = [];
  const fromTop = ch.y < 200, toTop = target[1] < 200;
  if (fromTop !== toTop){ pts.push([ch.x, WALK_Y], [target[0], WALK_Y]); }
  pts.push(target); ch.path = pts.map(p=>[p[0],p[1]]); ch.at = at;
}
function say(ch, text, ms=2400){ ch.bubble = text; ch.bubbleUntil = performance.now()+ms; }
function setLog(t){ document.getElementById("log").textContent = t; }
function touchSite(site, stage, team){ if (!site) return; const s = sites[site] || (sites[site] = {stage:"", t:0, teams:[]}); if (stage) s.stage = stage; s.t = Date.now(); if (team && !s.teams.includes(team)){ s.teams.push(team); s.teams = s.teams.slice(-4); } curSite = site; }

// ───────── 이벤트 처리 ─────────
function handle(ev){
  const k = ev.kind, st = STATIONS[ev.room] ? ev.room : null;
  if (k === "team_start"){
    const id = ev.agent_id || ev.team + Date.now(); const stn = st || "analysis";
    const seat = LOUNGE.seats[freeSeat()];
    const ch = mk(id, SPRITE_OF[stn], ev.team_kr || ev.team, seat[0], seat[1]); ch.seatIdx = LOUNGE.seats.indexOf(seat); ch.tag = ev.team_kr || ev.team;
    go(ch, slot(stn), stn); ch.state = "working"; activeStation = stn;
    say(chars.boss, "팀 호출 → " + (ev.team_kr || ev.team)); touchSite(ev.site || curSite, stn, ev.team_kr || ev.team);
    setLog(`${STATIONS[stn].name} 작업대 · ${ev.team_kr || ev.team} 투입`);
  } else if (k === "work"){
    if (ev.who === "boss" || !ev.agent_id || !chars[ev.agent_id]){
      const ch = chars.boss;
      if (st){ if (ch.at !== st) go(ch, [STATIONS[st].x + 46, STATIONS[st].y + 6], st); activeStation = st; }
      else if (ch.at !== "boss") go(ch, [BOSS_DESK.x, BOSS_DESK.y], "boss");
      ch.state = "working"; ch.label = ev.label || ev.tool || "";
      if (ev.call) say(ch, "팀 호출 → " + ev.call);
      touchSite(ev.site, st || "", "");
    } else {
      const ch = chars[ev.agent_id]; ch.state = "working"; ch.label = ev.label || ev.tool || ""; if (st && ch.at !== st){ go(ch, slot(st), st); activeStation = st; }
      touchSite(ev.site || curSite, st || "", ch.tag);
    }
    memos = memos.filter(m => m.type !== "notice");
    setLog(`${st ? STATIONS[st].name : "본부장석"} · ${ev.team_kr || "총괄 본부장"} · ${ev.tool || ""}${ev.label ? " · " + ev.label : ""}${ev.site ? " · [" + ev.site + "]" : ""}`);
  } else if (k === "done"){
    const ch = ev.who === "boss" ? chars.boss : null; if (ch && ch.state === "working") ch.label = "";
  } else if (k === "team_stop"){
    const ch = chars[ev.agent_id]; if (ch){ ch.state = "reporting"; ch.label = ""; const b = chars.boss; go(ch, [b.x - 36 - (Object.values(chars).filter(c=>c.state==="reporting").length*22), b.y + 4], "report");
      ch.after = ()=>{ say(ch, "보고 드립니다", 1800); say(b, "확인", 1200); ch.leaveAt = performance.now() + 2200; }; }
    setLog(`${st ? STATIONS[st].name : ""} · ${ch ? ch.tag : ev.team} 작업 끝`);
  } else if (k === "memo"){
    memos.push({text:(ev.memo_type==="permission_prompt"?"승인 요청 · ":ev.memo_type==="idle_prompt"?"대기 · ":"알림 · ")+ev.label, type:"notice"}); memos = memos.slice(-4);
    setLog("메모: " + ev.label);
  } else if (k === "rest"){
    activeStation = null; const b = chars.boss; b.state = "resting"; b.label = ""; const seat = LOUNGE.seats[0]; go(b, seat, "lounge"); b.after = ()=>{ b.hop = 1; };
    for (const id in chars){ if (id !== "boss") chars[id].leaveAt = performance.now() + 600; }
    memos = memos.filter(m => m.type !== "notice"); setLog("작업 끝 · 본부장 휴게실 · 팀 퇴근");
  } else if (k === "start" || k === "prompt"){
    const b = chars.boss; if (b.at !== "boss") go(b, [BOSS_DESK.x, BOSS_DESK.y], "boss"); b.state = "idle"; b.label = "";
    if (k === "start"){ memos = []; setLog("세션 시작" + (ev.cwd ? " · " + ev.cwd : "")); } else { touchSite(ev.site, "", ""); setLog("본부장 지시 · " + (ev.label || "")); }
  }
}

// ───────── 서버 폴링 ─────────
async function poll(){
  try{
    const r = await fetch(`/poll?since=${lastSeq}`, {cache:"no-store"}); if (!r.ok) throw 0;
    const j = await r.json();
    if (connected !== true){ connected = true; setStatus("서버 연결됨", "ok");
      if (firstPoll){ firstPoll = false; for (const ev of j.events) if (ev.kind === "work" && ev.site) touchSite(ev.site, STATIONS[ev.room] ? ev.room : "", ""); lastSeq = j.seq; j.events = []; } }
    for (const ev of j.events){ handle(ev); lastSeq = ev.id; }
    if (j.seq < lastSeq) lastSeq = 0;
  }catch(e){ if (connected !== false){ connected = false; setStatus(location.protocol === "file:" ? "서버 없음 (시뮬레이션만 가능)" : "서버 연결 끊김", "bad"); } }
  setTimeout(poll, connected ? 600 : 2500);
}
function setStatus(t, cls){ const s=document.getElementById("st"); s.textContent=t; s.className="st "+(cls||""); }

// ───────── 시뮬레이션: 실제 하루 — 착수는 5팀 동시, 그 뒤는 본부장 혼자, 검증은 검사 3명 동시 ─────────
const SIM = [
  {kind:"start", cwd:"jugansa"},
  {kind:"prompt", label:"/kickoff 엘리프 한신더휴 수원", site:"엘리프"},
  {kind:"team_start", team:"bid_notice_analyst", team_kr:"공고 분석관", room:"analysis", agent_id:"a1", site:"엘리프"},
  {kind:"team_start", team:"realestate_analyst", team_kr:"단지 분석팀", room:"analysis", agent_id:"a2", site:"엘리프"},
  {kind:"team_start", team:"cafe_insight", team_kr:"카페 인사이트팀", room:"analysis", agent_id:"a3", site:"엘리프"},
  {kind:"team_start", team:"bid_economist", team_kr:"손익 분석관", room:"analysis", agent_id:"a4", site:"엘리프"},
  {kind:"team_start", team:"bid_visual", team_kr:"단지 비주얼팀", room:"build", agent_id:"a5", site:"엘리프"},
  {kind:"work", who:"analyst", agent_id:"a1", room:"analysis", team_kr:"공고 분석관", tool:"Read", label:"notice.txt", site:"엘리프"},
  {kind:"team_stop", team:"bid_notice_analyst", room:"analysis", agent_id:"a1"},
  {kind:"team_stop", team:"realestate_analyst", room:"analysis", agent_id:"a2"},
  {kind:"team_stop", team:"cafe_insight", room:"analysis", agent_id:"a3"},
  {kind:"team_stop", team:"bid_economist", room:"analysis", agent_id:"a4"},
  {kind:"team_stop", team:"bid_visual", room:"build", agent_id:"a5"},
  {kind:"work", who:"boss", room:"build", tool:"Bash", label:"python3 build_el.py --no-pdf", site:"엘리프"},
  {kind:"work", who:"boss", room:"build", tool:"Edit", label:"data.py", site:"엘리프"},
  {kind:"work", who:"boss", room:"audit", tool:"Skill", label:"/court", site:"엘리프"},
  {kind:"team_start", team:"general-purpose", team_kr:"검사 1 · 형식", room:"audit", agent_id:"b1", site:"엘리프"},
  {kind:"team_start", team:"general-purpose", team_kr:"검사 2 · 허위약속", room:"audit", agent_id:"b2", site:"엘리프"},
  {kind:"team_start", team:"general-purpose", team_kr:"검사 3 · 운영진", room:"audit", agent_id:"b3", site:"엘리프"},
  {kind:"memo", memo_type:"permission_prompt", label:"Bash 실행 승인 필요"},
  {kind:"team_stop", room:"audit", agent_id:"b1"}, {kind:"team_stop", room:"audit", agent_id:"b2"}, {kind:"team_stop", room:"audit", agent_id:"b3"},
  {kind:"work", who:"boss", room:"build", tool:"Edit", label:"build_el.py (판결 반영)", site:"엘리프"},
  {kind:"prompt", label:"상주 올려줘", site:"상주"},
  {kind:"work", who:"boss", room:"mail", tool:"Bash", label:"assemble_sj.py · lx_gif.py", site:"상주"},
  {kind:"work", who:"boss", room:"mail", tool:"Write", label:"mail_sj/index.html", site:"상주"},
  {kind:"team_start", team:"bid_pmo", team_kr:"마감 관제팀", room:"retro", agent_id:"c1", site:"상주"},
  {kind:"work", who:"pmo", agent_id:"c1", room:"retro", team_kr:"마감 관제팀", tool:"Edit", label:"입찰현황판.md", site:"상주"},
  {kind:"team_stop", room:"retro", agent_id:"c1"},
  {kind:"rest"},
];
function runSim(){
  if (simTimer){ clearTimeout(simTimer); simTimer=null; document.getElementById("simBtn").textContent="시뮬레이션 시작"; return; }
  document.getElementById("simBtn").textContent="시뮬레이션 중지"; let i = 0;
  const step = () => { if (i >= SIM.length){ simTimer=null; document.getElementById("simBtn").textContent="시뮬레이션 시작"; return; } handle(SIM[i++]); simTimer = setTimeout(step, 2300); };
  step();
}
document.getElementById("simBtn").onclick = runSim;
document.getElementById("restBtn").onclick = () => handle({kind:"rest"});

// ───────── 배경 ─────────
const bg = document.createElement("canvas"); bg.width = 1200; bg.height = 720;
function px(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function drawBackground(){
  const g = bg.getContext("2d");
  // 바닥: 한 공간(오픈 플로어)
  for (let y=0; y<720; y+=16) for (let x=0; x<1200; x+=16) px(g,x,y,16,16,((x/16+y/16)%2)?"#d2c3a0":"#c8b994");
  px(g,0,0,1200,8,"#3a2f24"); px(g,0,712,1200,8,"#3a2f24"); px(g,0,0,8,720,"#3a2f24"); px(g,1192,0,8,720,"#3a2f24");
  // 작업 라인 띠(위쪽 작업대 줄)
  px(g,24,40,1150,200,"#bfae88"); px(g,24,40,1150,4,"#8a7a56");
  g.fillStyle = "#5a4a30"; g.font = "bold 12px 'Malgun Gothic', sans-serif"; g.fillText("작업 라인 · 왼쪽에서 오른쪽으로 일이 흐릅니다 · 작업대 앞에 선 사람 = 지금 일하는 팀", 36, 230);
  // 작업대 7개
  ORDER.forEach(k=>{ const s = STATIONS[k];
    px(g,s.x-50,s.y-60,100,46,"#8b6a46"); px(g,s.x-50,s.y-60,100,4,"#a98a5e");       // 책상
    px(g,s.x-14,s.y-82,28,20,"#1c2430"); px(g,s.x-11,s.y-79,22,14,"#3b6f8f");       // 모니터
    px(g,s.x-44,s.y-50,22,14,"#e5dfcf"); px(g,s.x+20,s.y-52,24,16,"#d8d0bd");       // 서류
    px(g,s.x-54,s.y-124,108,36,"#1e1813"); px(g,s.x-54,s.y-124,4,36,s.color);       // 명패 2줄
    g.fillStyle = "#f3ead8"; g.font = "bold 13px 'Malgun Gothic', sans-serif"; g.fillText(`${s.n} ${s.name}`, s.x-46, s.y-109);
    g.fillStyle = "#b7ab96"; g.font = "10px 'Malgun Gothic', sans-serif"; g.fillText(s.sub, s.x-46, s.y-95);
    if (s.n < 7){ g.fillStyle = "#8a7a56"; g.fillText("▶", s.x+56, s.y-36); }
  });
  // 본부장 책상
  px(g,BOSS_DESK.x-56,BOSS_DESK.y-62,112,50,"#5a4630"); px(g,BOSS_DESK.x-56,BOSS_DESK.y-62,112,4,"#8a7440");
  px(g,BOSS_DESK.x-16,BOSS_DESK.y-86,32,22,"#1c2430"); px(g,BOSS_DESK.x-13,BOSS_DESK.y-83,26,16,"#2d4a6a");
  px(g,BOSS_DESK.x-56,BOSS_DESK.y-124,112,36,"#1e1813"); px(g,BOSS_DESK.x-56,BOSS_DESK.y-124,4,36,"#c8a35a");
  g.fillStyle = "#f3ead8"; g.font = "bold 13px 'Malgun Gothic', sans-serif"; g.fillText("총괄 본부장석", BOSS_DESK.x-50, BOSS_DESK.y-109);
  g.fillStyle = "#b7ab96"; g.font = "10px 'Malgun Gothic', sans-serif"; g.fillText("총괄 · 결정 · 팀 호출", BOSS_DESK.x-46, BOSS_DESK.y-95);
  // 대기 · 휴게
  const L = LOUNGE.box; px(g,L[0],L[1],L[2]-L[0],L[3]-L[1],"#7f9a6a"); px(g,L[0]+4,L[1]+4,L[2]-L[0]-8,L[3]-L[1]-8,"#93ad7a");
  g.fillStyle = "#2f3d28"; g.font = "bold 12px 'Malgun Gothic', sans-serif"; g.fillText("대기 · 휴게  — 호출된 팀은 여기서 출발해 작업대로 가고, 끝나면 퇴근합니다", L[0]+12, L[1]+20);
  for (let r=0;r<3;r++) for (let c=0;c<6;c++){ const x = 90 + c*80, y = 420 + r*110; px(g,x-26,y-10,52,18,"#c9b58a"); }  // 소파
  for (const [x,y] of [[L[0]+10,L[3]-30],[L[2]-26,L[3]-30]]){ px(g,x,y+14,16,10,"#7a5a3c"); px(g,x+2,y,12,16,"#3f7a3a"); px(g,x-3,y+4,9,9,"#4f9448"); }
  // 단지 보드 틀
  const B = BOARD.box; px(g,B[0],B[1],B[2]-B[0],B[3]-B[1],"#2a2621"); px(g,B[0]+4,B[1]+4,B[2]-B[0]-8,B[3]-B[1]-8,"#efe8d6");
  g.fillStyle = "#1e1813"; g.font = "bold 13px 'Malgun Gothic', sans-serif"; g.fillText("진행 중 단지 보드 — 마감 D-day · 지금 어느 단계인지", B[0]+14, B[1]+24);
}

// ───────── 그리기 루프 ─────────
const cv = document.getElementById("c"), ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
let last = performance.now();
function tick(now){ const dt = Math.min(0.05,(now-last)/1000); last = now;
  for (const id in chars){ const ch = chars[id]; move(ch, dt);
    if (id !== "boss" && ch.leaveAt && now > ch.leaveAt && ch.state !== "leaving" && !ch.path.length){ ch.state = "leaving"; ch.tag = ch.tag; go(ch, [ch.x < 600 ? 30 : 1170, 700], "exit"); ch.after = ()=>{ delete chars[id]; }; }
  }
  draw(now); requestAnimationFrame(tick); }
function move(ch, dt){
  if (ch.path.length){ const [tx,ty] = ch.path[0]; const dx=tx-ch.x, dy=ty-ch.y, d=Math.hypot(dx,dy), step=WALK_SPEED*dt;
    if (Math.abs(dx) > 1) ch.face = dx > 0 ? 1 : -1;
    if (d <= step){ ch.x=tx; ch.y=ty; ch.path.shift(); if (!ch.path.length){ ch.hop = 1; if (ch.after){ const f=ch.after; ch.after=null; f(); } } }
    else { ch.x += dx/d*step; ch.y += dy/d*step; } }
  if (ch.hop > 0) ch.hop = Math.max(0, ch.hop - dt*2.2);
}
let lastChat = 0;
function draw(now){
  ctx.drawImage(bg, 0, 0);
  if (now - lastChat > 2600){ lastChat = now; const groups = {};
    for (const id in chars){ const c = chars[id]; if (c.state === "working" && STATIONS[c.at] && !c.path.length) (groups[c.at] = groups[c.at] || []).push(c); }
    for (const k in groups){ const g = groups[k]; if (g.length >= 2){ const a = g[Math.floor(Math.random()*g.length)]; if (!a.bubble || now > a.bubbleUntil) say(a, ["같이 볼까요", "이 부분 확인", "근거 쪽은?", "제 쪽은 끝", "숫자 맞춰요"][Math.floor(Math.random()*5)], 1600); } } }
  if (activeStation){ const s = STATIONS[activeStation]; ctx.strokeStyle = s.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.45 + 0.3*Math.sin(now/300); ctx.strokeRect(s.x-58, s.y-128, 116, 160); ctx.globalAlpha = 1; }
  // 메모(작업 라인 아래 통로)
  memos.forEach((m,i)=>{ const x = 40 + i*150, y = 252, w = 140, h = 30;
    ctx.fillStyle = "#ffd6c8"; ctx.fillRect(x,y,w,h); ctx.strokeStyle="#5a4630"; ctx.lineWidth=2; ctx.setLineDash([4,3]); ctx.strokeRect(x+1,y+1,w-2,h-2); ctx.setLineDash([]);
    ctx.fillStyle="#3a2a18"; ctx.font="bold 12px monospace"; ctx.fillText(clip(m.text, 17), x+8, y+20); });
  drawBoard(now);
  // 캐릭터
  const list = Object.values(chars).sort((a,b)=>a.y-b.y);
  for (const ch of list){ const walking = ch.path.length>0, img = IMG[ch.sprite + (walking ? "_walk" : "_stand")]; if (!img) continue;
    const w = img.width*SCALE, h = img.height*SCALE;
    const bob = walking ? Math.abs(Math.sin(now/140))*2 : (ch.state==="working" ? Math.sin(now/260)*1.5 : 0);
    const hop = ch.hop > 0 ? Math.sin(ch.hop*Math.PI)*7 : 0;
    const x = ch.x - w/2, y = ch.y - h + 10 - bob - hop;
    ctx.save(); if (ch.face < 0){ ctx.translate(ch.x,0); ctx.scale(-1,1); ctx.translate(-ch.x,0); } ctx.drawImage(img, x, y, w, h); ctx.restore();
    const col = ch.state==="working" ? "#6fd37a" : ch.state==="reporting" ? "#f2c14e" : ch.state==="resting" ? "#8fb4e8" : ch.state==="leaving" ? "#aaa" : "#ddd";
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ch.x + w/2 - 4, y + 6, 5, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle="#222"; ctx.lineWidth=1.5; ctx.stroke();
    let ty = y - 4;
    if (ch.state==="working" && ch.label && !walking){ tag(ch.x, ty, ch.label, "#222", "#f5f0e4"); ty -= 22; }
    if (ch.bubble && now < ch.bubbleUntil){ tag(ch.x, ty, ch.bubble, "#fff", "#1d1a16"); ty -= 22; }
    nameplate(ch.x, y + h - 2, ch.id === "boss" ? "총괄 본부장" : ch.tag || ch.name, ch.id === "boss" ? "#c8a35a" : (STATIONS[ch.at] ? STATIONS[ch.at].color : "#bbb"));
    ch._box = [x, y, w, h];
  }
}
function drawBoard(now){
  const B = BOARD.box; let y = B[1] + 44;
  ctx.font = "11px 'Malgun Gothic', sans-serif"; ctx.fillStyle = "#6e5f45";
  ctx.fillText("마감", B[0]+96, y-8); ctx.fillText("D-day", B[0]+170, y-8);
  ORDER.forEach((k,i)=>{ ctx.fillText(STATIONS[k].name, B[0] + 236 + i*44, y - 8); });
  // 행 = 현황판 단지(마감 순) + 현황판에 없는데 신호만 있는 단지
  const rows = boardRows.map(r => ({...r})); const seen = new Set(rows.map(r=>r.site));
  for (const n in sites) if (!seen.has(n)) rows.push({site:n, name:n, due:"", dday:null, done:false});
  if (!rows.length){ ctx.fillStyle = "#8a7a56"; ctx.font = "12px 'Malgun Gothic', sans-serif"; ctx.fillText("현황판(jugansa/입찰현황판.md)을 아직 못 찾음 — 세션을 시작하면 읽습니다", B[0]+14, y+16); return; }
  rows.slice(0, 8).forEach(r=>{ const s = sites[r.site] || {stage:"", t:0, teams:[]}, stale = !s.t || Date.now() - s.t > SITE_STALE_MS, cur = r.site === curSite;
    const urgent = r.dday !== null && r.dday <= 2 && !r.done;
    ctx.fillStyle = r.done ? "#d9d3c4" : cur ? "#fff3b0" : urgent ? "#ffd6c8" : "#e4dcc8"; ctx.fillRect(B[0]+10, y, B[2]-B[0]-20, 40);
    ctx.fillStyle = r.done ? "#8a7a56" : "#1e1813"; ctx.font = "bold 13px 'Malgun Gothic', sans-serif"; ctx.fillText(r.site, B[0]+18, y+18);
    ctx.font = "10px 'Malgun Gothic', sans-serif"; ctx.fillStyle = "#6e5f45"; ctx.fillText(clip(r.name, 14), B[0]+18, y+33);
    ctx.font = "11px 'Malgun Gothic', sans-serif"; ctx.fillStyle = "#3a2a18"; ctx.fillText(clip(r.due || "—", 14), B[0]+96, y+18);
    if (r.pt){ ctx.fillStyle = "#6e5f45"; ctx.font = "10px 'Malgun Gothic', sans-serif"; ctx.fillText("PT " + clip(r.pt, 12) + (r.pt_dday !== null && r.pt_dday >= 0 ? " (D-" + r.pt_dday + ")" : ""), B[0]+96, y+33); }
    // D-day 칸
    let dtxt = r.done ? "제출 완료" : r.dday === null ? "—" : r.dday > 0 ? "D-" + r.dday : r.dday === 0 ? "D-DAY" : "지남";
    ctx.font = "bold 13px monospace"; ctx.fillStyle = r.done ? "#5a8a5a" : urgent ? "#b4322a" : "#1e1813"; ctx.fillText(dtxt, B[0]+170, y+22);
    if (urgent && !r.done && (Math.floor(now/500)%2)){ ctx.strokeStyle = "#b4322a"; ctx.lineWidth = 2; ctx.strokeRect(B[0]+164, y+6, 60, 24); }
    // 단계 점
    ORDER.forEach((k,i)=>{ const x = B[0] + 248 + i*44, on = s.stage === k; ctx.beginPath(); ctx.arc(x, y+20, on ? 9 : 5, 0, Math.PI*2); ctx.fillStyle = on ? STATIONS[k].color : "#c9bfa6"; ctx.fill(); if (on && !stale && (Math.floor(now/400)%2)){ ctx.strokeStyle = "#1e1813"; ctx.lineWidth = 2; ctx.stroke(); } });
    if (s.teams && s.teams.length){ ctx.fillStyle = "#6e5f45"; ctx.font = "10px 'Malgun Gothic', sans-serif"; ctx.fillText(clip(s.teams.slice(-2).join(" · "), 26), B[0]+236, y+36); }
    y += 46; });
}
function tag(cx, by, text, fg, bgc){ ctx.font = "bold 12px monospace"; const t = clip(text, 24), w = ctx.measureText(t).width + 14, x = Math.min(1200-w-4, Math.max(4, cx - w/2)), y = by - 20;
  ctx.fillStyle = bgc; ctx.fillRect(x, y, w, 19); ctx.strokeStyle="#444"; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,18); ctx.fillStyle = fg; ctx.fillText(t, x+7, y+13); }
function nameplate(cx, by, text, col){ ctx.font = "11px 'Malgun Gothic', sans-serif"; const w = ctx.measureText(text).width + 10; ctx.fillStyle = "rgba(20,16,12,.8)"; ctx.fillRect(cx - w/2, by, w, 15); ctx.fillStyle = col; ctx.fillRect(cx - w/2, by, 3, 15); ctx.fillStyle = "#f3ead8"; ctx.fillText(text, cx - w/2 + 6, by + 11); }
function clip(s, n){ s = String(s); return s.length > n ? s.slice(0, n-1) + "…" : s; }
cv.addEventListener("click", e => { const r = cv.getBoundingClientRect(), pxx = (e.clientX - r.left) * 1200 / r.width, pyy = (e.clientY - r.top) * 720 / r.height;
  for (const id in chars){ const ch = chars[id], b = ch._box; if (!b) continue; if (pxx >= b[0] && pxx <= b[0]+b[2] && pyy >= b[1] && pyy <= b[1]+b[3]){
    say(ch, ch.state==="working" ? "[작업 중] " + (ch.label || ch.tag || "") : ch.state==="reporting" ? "[보고 중]" : ch.state==="resting" ? "[휴식 중]" : ch.state==="leaving" ? "[퇴근]" : "[대기 중]"); return; } } });

drawBackground();
Promise.all(assets.map(a=>load(a[0],a[1]))).then(()=>{ requestAnimationFrame(tick); poll(); loadBoard(); });
</script>
