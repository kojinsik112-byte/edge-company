<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 주관사업부 오피스</title>
<style>
  html,body{margin:0;height:100%;background:#dfe3e8;overflow:hidden;font-family:"Malgun Gothic","Pretendard",sans-serif}
  #fit{position:absolute;inset:0;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1600px;height:1300px;transform-origin:0 0}
  #bg{position:absolute;left:0;top:0;width:1600px;height:1300px}
  .seat,.walker{position:absolute;pointer-events:none}
  .walker{z-index:4;transition:opacity .25s}
  .bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1.2px solid #d8cdbb;border-radius:11px;padding:4px 11px;font-size:13px;font-weight:700;color:#2b2018;white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.18);z-index:7;max-width:330px;overflow:hidden;text-overflow:ellipsis}
  .bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  .bub.boss{background:#fff6dc}.bub.boss:after{border-top-color:#fff6dc}
  .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-sizing:border-box;z-index:6}
  .dot.on{background:#34c46c;box-shadow:0 0 0 5px rgba(52,196,108,.25)}
  .dot.off{background:#b4bac4;width:10px;height:10px;margin:-5px 0 0 -5px}
  .dot.away{background:#c9a45c}
  .tag{position:absolute;transform:translate(-50%,0);background:#1b2433;border:1px solid #c9a45c;color:#ffe7a6;font-size:12px;font-weight:700;border-radius:11px;padding:2px 9px;z-index:6;white-space:nowrap}
  .badge{position:absolute;color:#fff;font-size:13px;font-weight:700;border-radius:11px;padding:2px 10px;background:#8a909c;white-space:nowrap}
  .badge.on{background:#2f9a5a}
  header{position:absolute;left:0;top:0;width:1600px;height:80px;display:flex;align-items:center;gap:12px;padding:0 24px;box-sizing:border-box;border-bottom:2px solid #c9a45c;color:#fbf3e2;z-index:8}
  header h1{margin:0;font-size:26px;font-weight:800}
  header small{color:#c9a45c;font-size:13px}
  .sp{flex:1}
  .clock{display:flex;align-items:center;gap:10px;background:#fbf6ec;border:2px solid #c9a45c;border-radius:28px;padding:4px 18px;color:#1b2433}
  .clock b{font-size:28px}.clock span{font-size:13px;color:#8a7258}
  .clock i{width:26px;height:26px;border-radius:50%;background:#f3b63e;border:2px solid #e09a20}
  .pill{border-radius:18px;padding:6px 14px;font-size:15px;font-weight:700;color:#fff}
  .pill:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:8px;vertical-align:1px}
  #st{background:#3a3f48;border:1px solid #545a66;font-size:13px}
  #st.ok:before{background:#5fe39a}#st.bad:before{background:#ef8f7c}
  header button{background:transparent;color:#fbf3e2;border:1px solid rgba(201,164,92,.7);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  header button:hover{background:rgba(201,164,92,.18)}
  #board{position:absolute;display:flex;gap:16px;padding:14px;box-sizing:border-box;color:#e9e3d6;font-size:12px;z-index:3}
  #left{flex:1;display:flex;flex-direction:column;min-width:0}
  #ptbar:empty{display:none}
  .ptc{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:9px;background:#3a3018;border:1.4px solid #c9a45c;margin-bottom:8px}
  .ptc .t{background:#c9a45c;color:#2a2210;font-weight:800;font-size:12px;border-radius:11px;padding:3px 10px}
  .ptc .w{flex:1;font-size:17px;font-weight:700;color:#ffe7a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptc .w small{font-size:12px;color:#c9b88a;margin-left:6px;font-weight:400}
  .ptc .d{background:#c9a45c;color:#2a2210;font-weight:800;border-radius:11px;padding:3px 12px}
  .ptc.near .d{background:#ef8f7c;animation:ptb 1.2s ease-in-out infinite}
  @keyframes ptb{50%{transform:scale(1.08)}}
  .row{display:grid;grid-template-columns:96px 150px 70px 360px 1fr;align-items:center;height:30px;padding:0 10px;border-bottom:1px solid #222c3e;white-space:nowrap}
  .row>span{overflow:hidden;text-overflow:ellipsis}
  .head{height:24px;color:#7f8aa0;font-size:11px}
  #rows{flex:1;overflow-y:auto;scrollbar-color:#8592ab #232d40;scrollbar-width:thin}
  #rows::-webkit-scrollbar{width:7px}#rows::-webkit-scrollbar-track{background:#232d40;border-radius:4px}#rows::-webkit-scrollbar-thumb{background:#8592ab;border-radius:4px}
  #rows .nm{font-size:15px;font-weight:700;color:#fff}
  #rows .due{color:#c3cbd8}
  #rows .row.cur{background:rgba(201,164,92,.14);box-shadow:inset 3px 0 0 #c9a45c}
  #rows .row.done{opacity:.72}
  .dd{display:inline-block;min-width:48px;text-align:center;font-weight:700;font-size:11px;border-radius:10px;padding:1px 0;background:#5a6273;color:#fff}
  .dd.urgent{background:#c9483b;animation:blink 1s steps(2,start) infinite}.dd.done{background:#2c6e4c;color:#d9f5e4}
  @keyframes blink{to{background:#8a2a1f}}
  .pips{display:flex;align-items:center}
  .pips i{display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid #3f4a5e;box-sizing:border-box;margin-right:34px;position:relative}
  .pips i.past{border:0}
  .pips i.on{width:16px;height:16px;border:2px solid #fff;margin-right:30px}
  .pips i.live{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.3)}}
  #rows .pt{color:#7f8aa0}#rows .pt.has{color:#f2cf7a}
  #up{width:360px;background:#1b2436;border:1px solid #2b3549;border-radius:10px;padding:12px 16px;box-sizing:border-box;display:flex;flex-direction:column}
  #up b{font-size:15px;color:#fff;margin-bottom:10px}
  #uplist{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#8592ab #232d40}
  .ev{display:grid;grid-template-columns:80px auto 1fr auto;gap:8px;align-items:center;height:30px}
  .ev .k{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px}
  .ev .s{font-size:14px;font-weight:700;color:#fff}.ev .n{color:#7f8aa0;font-weight:700}.ev .n.u{color:#ff8a7a}.ev .dt{color:#c3cbd8}
  #ptalert{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:9;min-width:640px;padding:16px 22px;border-radius:14px;background:rgba(29,22,8,.96);box-shadow:0 0 0 2px #c9a45c,0 18px 50px rgba(0,0,0,.5);color:#f3dfb0;font-size:15px;display:none}
  #ptalert.on{display:block}#ptalert h2{margin:0 0 6px;color:#ffd77a}
  #ptalert button{margin-top:10px;background:#c9a45c;border:0;border-radius:12px;padding:6px 16px;font-weight:800;cursor:pointer}
  #log{position:absolute;left:30px;top:1278px;width:1540px;color:#6a7280;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #memos{position:absolute;right:26px;top:88px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:8}
  #memos div{background:#1b2433;color:#ffe7a6;border:1px solid #c9a45c;border-radius:12px;padding:4px 12px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <img id="bg" alt="">
  <div id="layer"></div>
  <header id="hd">
    <h1>AI 주관사업부 오피스</h1><small id="sub"></small><span class="sp"></span>
    <div class="clock"><i></i><b id="hm">--:--</b><span id="md"></span></div>
    <span class="pill" style="background:#2f9a5a" id="cWork">작업 중 0</span>
    <span class="pill" style="background:#5a6273" id="cWait">내 답 대기 0</span>
    <span class="pill" style="background:#2f6fd0" id="cDone">오늘 끝남 0</span>
    <span class="pill" id="st">서버 확인 중</span>
    <button id="simBtn">시뮬레이션</button>
  </header>
  <section id="board" aria-label="진행 중 단지 보드">
    <div id="left"><div id="ptbar"></div>
      <div class="row head"><span>단지</span><span>마감</span><span>D-day</span><span>단계 &nbsp;개척 · 착수 · 제작 · 검증 · 발송대기 · 발송 · PT · 결과</span><span>PT 일정</span></div>
      <div id="rows"></div></div>
    <div id="up"><b>다가오는 일정</b><div id="uplist"></div></div>
  </section>
  <div id="memos"></div>
  <div id="ptalert" role="alert"></div>
  <div id="log">·</div>
</div></div>
<script>
// AI 주관사업부 오피스 v4 — 3D 사무실(마블 펜트하우스) + 원피스직원 · 그림과 자리 배치는 static/v4 (design/office_html.py --assets 로 만든다)
// 훅 신호(/poll) · 현황판(/sites) · PT 알림은 v3 와 같다. 옛 화면 = /v3
const STATIONS = {scout:{name:"개척",color:"#d9a441"}, analysis:{name:"착수분석",color:"#5f95db"}, build:{name:"제작",color:"#5cb87a"}, audit:{name:"검증",color:"#e07a68"},
                  mail:{name:"발송",color:"#a77fd6"}, pt:{name:"PT",color:"#e6ad3c"}, retro:{name:"결과·관제",color:"#4fb8b0"}};
const BOARD_ORDER = ["scout","analysis","build","audit","ready","mail","pt","retro"];
const BSTAGE = k => k === "ready" ? {name:"발송대기", color:"#ef8a3c"} : STATIONS[k];
const SITE_STALE_MS = 30*60*1000, CREW_IDLE = 25000, AGENT_STALE = 180000, WALK = 170;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n-1) + "…" : s; };
const $ = id => document.getElementById(id), layer = $("layer");
let L = null, seats = [], boss = null, BATCH = 0, lastSeq = 0, firstPoll = true, connected = null, curSite = "", simTimer = null;
let memos = [], waitN = 0, doneN = 0;
const sites = {};
let boardRows = [];
const el = (tag, cls, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); layer.appendChild(e); return e; };
const px = v => v + "px";

function fit(){ const k = Math.min(innerWidth / 1600, innerHeight / 1300); const st = $("stage"); st.style.transform = `scale(${k})`; st.style.left = px((innerWidth - 1600*k) / 2); }
addEventListener("resize", fit);

// ───────── 자리 · 캐릭터 ─────────
async function init(){
  L = await (await fetch("/v4/layout.json", {cache:"no-store"})).json();
  $("bg").src = "/v4/bg.svg"; document.body.style.background = L.bg;
  $("hd").style.background = `linear-gradient(${L.header},${L.header2})`;
  $("sub").textContent = `EDGE COMPANY · ${L.office_name} · 원피스직원`;
  const b = L.board; Object.assign($("board").style, {left:px(b.x), top:px(b.y), width:px(b.w), height:px(b.h)});
  for (const team in L.seats) L.seats[team].forEach(s => {
    const img = el("img", "seat", {left:px(s.work.x), top:px(s.work.y), width:px(s.work.w), height:px(s.work.h)}); img.src = "/v4/" + s.idle.file;
    seats.push({...s, img, state:"idle", agent:null, label:"", lastWork:0, used:0, batch:-1, dot:el("div", "dot off", {left:px(s.hx + 18), top:px(s.hy)}), bub:null, tag:null});
  });
  for (const team in L.rooms){ const r = L.rooms[team]; r.badgeEl = el("span", "badge", {left:px(r.badge[0]), top:px(r.badge[1])}); }
  const bs = L.boss.sprite; boss = {img: el("img", "seat", {left:px(bs.x), top:px(bs.y), width:px(bs.w), height:px(bs.h)}), bub:null, until:0};
  boss.img.src = "/v4/" + bs.file;
  // 그림 미리 받아 두기 (일하기 ↔ 쉬기 바꿀 때 깜빡임 없게)
  seats.forEach(s => { new Image().src = "/v4/" + s.work.file; new Image().src = "/v4/" + s.stand.file; });
  fit(); render(); loadBoard(); poll(); setInterval(tickIdle, 1000); clock(); setInterval(clock, 15000);
  requestAnimationFrame(frame);
}
function clock(){ const d = new Date(); $("hm").textContent = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; $("md").textContent = `${d.getMonth()+1}.${d.getDate()}(${"일월화수목금토"[d.getDay()]})`; }

function setState(s, st, label){
  s.state = st; if (label !== undefined) s.label = label;
  s.img.style.visibility = st === "away" ? "hidden" : "visible";
  if (st !== "away") s.img.src = "/v4/" + (st === "work" ? s.work.file : s.idle.file);
  s.dot.className = "dot " + (st === "work" ? "on" : st === "away" ? "away" : "off");
  if (st === "away"){ if (!s.tag){ s.tag = el("div", "tag", {left:px(s.hx), top:px(s.hy + 16)}); s.tag.textContent = "보고 중"; } }
  else if (s.tag){ s.tag.remove(); s.tag = null; }
  render();
}
function bubble(owner, x, y, text, cls, ms){
  if (owner.bub) owner.bub.remove();
  owner.bub = el("div", "bub" + (cls ? " " + cls : ""), {left:px(x), top:px(y)}); owner.bub.textContent = clip(text, 40);
  if (ms){ const b = owner.bub; setTimeout(() => { if (owner.bub === b){ b.remove(); owner.bub = null; } }, ms); }
}
function bossSay(t, ms=2600){ bubble(boss, L.boss.hx + 40, L.boss.hy - 10, t, "boss", ms); }
function render(){
  // 방마다 말풍선은 가장 최근에 일한 1명만 (나머지는 초록 점)
  for (const team in L.rooms){
    const r = L.rooms[team], mine = seats.filter(s => s.team === team), on = mine.filter(s => s.state === "work");
    r.badgeEl.textContent = `작업 ${on.length} / ${r.n}석`; r.badgeEl.className = "badge" + (on.length ? " on" : "");
    const lead = on.sort((a, b) => b.lastWork - a.lastWork)[0];
    for (const s of mine){
      if (s === lead && s.label){ const bw = Math.min(330, s.label.length * 9 + 30), x = Math.min(Math.max(s.hx, r.x + 20 + bw/2), r.x + r.w - 20 - bw/2);
        if (!s.bub || s.bub.textContent !== clip(s.label, 40)) bubble(s, x, s.hy - 12, s.label); }
      else if (s.bub){ s.bub.remove(); s.bub = null; }
    }
  }
  const working = seats.filter(s => s.state === "work").length;
  $("cWork").textContent = `작업 중 ${working}`; $("cWait").textContent = `내 답 대기 ${waitN}`; $("cDone").textContent = `오늘 끝남 ${doneN}`;
  $("memos").innerHTML = memos.map(m => `<div>${esc(m.text)}</div>`).join("");
}
function freeSeats(team){ return seats.filter(s => s.team === team && !s.agent && s.state !== "away" && s.state !== "walk"); }
function assign(team, text, agent){
  const now = performance.now(), pool = freeSeats(team); if (!pool.length) return null;
  let s = agent ? null : pool.filter(s => s.state === "work" && s.batch === BATCH).sort((a, b) => b.lastWork - a.lastWork)[0];   // 같은 지시면 같은 사람이 이어서
  if (!s) s = pool.filter(s => s.state === "idle").sort((a, b) => a.used - b.used)[0];
  if (!s) s = pool.sort((a, b) => a.lastWork - b.lastWork)[0];
  s.agent = agent || null; s.batch = BATCH; s.used = now; s.lastWork = now; setState(s, "work", text); return s;
}
function tickIdle(){
  const now = performance.now(); let ch = false;
  for (const s of seats){
    if (s.state !== "work") continue;
    if (!s.agent && now - s.lastWork > CREW_IDLE){ setState(s, "idle", ""); ch = true; }
    else if (s.agent && now - s.lastWork > AGENT_STALE){ s.agent = null; setState(s, "idle", ""); ch = true; }
  }
  if (ch) render();
}

// ───────── 본부장실로 걸어가서 보고 → 자리로 돌아오기 ─────────
const walkers = [];
// 자리 → 방 문 → 좁은 복도 → 본부장실 문 → 보고 자리 (door 표시 두 점 사이는 문을 지나가는 것 = 잠깐 사라졌다 나타남)
function pathTo(s){
  const r = L.rooms[s.team], d = r.door, bd = L.boss.door, cy = L.corrY[r.row], k = walkers.filter(w => w.phase !== "back").length;
  return [{x:s.fx, y:s.fy}, {x:(s.fx + d.in[0]) / 2, y:r.y + r.h - 26}, {x:d.in[0], y:d.in[1], door:true}, {x:d.out[0], y:d.out[1], door:true},
          {x:d.colX, y:cy}, {x:bd.colX, y:cy}, {x:bd.out[0], y:bd.out[1], door:true}, {x:bd.in[0], y:bd.in[1], door:true},
          {x:L.boss.spot[0] + k * 26, y:L.boss.spot[1]}];
}
function report(s){
  if (!s || s.state === "away" || s.state === "walk") return;
  if (s.bub){ s.bub.remove(); s.bub = null; }
  setState(s, "away"); doneN++;
  const w = {s, pts: pathTo(s), i: 0, x: s.fx, y: s.fy, phase: "go", wait: 0, img: el("img", "walker", {width:px(s.stand.w), height:px(s.stand.h)}), bub:null};
  w.img.src = "/v4/" + s.stand.file; walkers.push(w); place(w); render();
}
function place(w){ const bob = w.phase === "wait" ? 0 : Math.abs(Math.sin(performance.now() / 120)) * 3;
  w.img.style.left = px(w.x - w.s.stand.w / 2); w.img.style.top = px(w.y - w.s.stand.h * w.s.stand.feet - bob);
  if (w.bub){ w.bub.style.left = px(w.x); w.bub.style.top = px(w.y - w.s.stand.h * 0.92); } }
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const w of walkers.slice()){
    if (w.hold){ if (now < w.hold) continue; w.hold = 0; w.img.style.opacity = 1; }
    if (w.phase === "wait"){ if (now > w.wait){ w.phase = "back"; w.pts = w.pts.slice().reverse(); w.i = 0; if (w.bub){ w.bub.remove(); w.bub = null; } } place(w); continue; }
    const t = w.pts[w.i + 1];
    if (!t){
      if (w.phase === "go"){ w.phase = "wait"; w.wait = now + 2600; bubble(w, w.x, w.y - w.s.stand.h * 0.92, "보고 드립니다", "", 0); setTimeout(() => bossSay("확인! 수고했어!"), 700); }
      else { w.img.remove(); walkers.splice(walkers.indexOf(w), 1); setState(w.s, "idle", ""); }
      continue;
    }
    const dx = t.x - w.x, dy = t.y - w.y, d = Math.hypot(dx, dy), step = WALK * dt;
    if (d <= step){ w.x = t.x; w.y = t.y; w.i++; const nx = w.pts[w.i + 1];
      if (t.door && nx && nx.door){ w.img.style.opacity = 0; w.hold = now + 350; w.x = nx.x; w.y = nx.y; w.i++; place(w); continue; } }
    else { w.x += dx / d * step; w.y += dy / d * step; }
    w.img.style.transform = dx < -0.5 ? "scaleX(-1)" : ""; place(w);
  }
  requestAnimationFrame(frame);
}

// ───────── 이벤트 (훅 신호) ─────────
function setLog(t){ $("log").textContent = t; }
function touchSite(site, stage, team){ if (!site) return; const s = sites[site] || (sites[site] = {stage:"", t:0, teams:[]}); if (stage) s.stage = stage; s.t = Date.now(); if (team && !s.teams.includes(team)){ s.teams.push(team); s.teams = s.teams.slice(-4); } curSite = site; renderBoard(); }
const agentSeat = {};
function handle(ev){
  const k = ev.kind, st = STATIONS[ev.room] ? ev.room : null;
  if (k === "team_start"){
    const room = st || "analysis", s = assign(room, ev.team_kr || ev.team || "팀", ev.agent_id || ("x" + Date.now()));
    if (s) agentSeat[s.agent] = s;
    bossSay("팀 호출 → " + (ev.team_kr || ev.team)); touchSite(ev.site || curSite, room, ev.team_kr || ev.team);
    setLog(`${STATIONS[room].name} · ${ev.team_kr || ev.team} 투입`);
  } else if (k === "work"){
    waitN = 0; memos = memos.filter(m => m.type !== "notice");
    if (ev.agent_id && ev.who !== "boss"){
      let s = agentSeat[ev.agent_id]; if (!s){ handle({...ev, kind:"team_start"}); s = agentSeat[ev.agent_id]; }
      if (s){ s.lastWork = performance.now(); s.label = (ev.team_kr ? ev.team_kr + " · " : "") + (ev.label || ev.tool || ""); setState(s, "work"); }
      touchSite(ev.site || curSite, st || "", ev.team_kr);
    } else {
      if (st) assign(st, ev.label || ev.tool || "");
      if (ev.call) bossSay("팀 호출 → " + ev.call);
      touchSite(ev.site, st || "", "");
    }
    setLog(`${st ? STATIONS[st].name : "본부장실"} · ${ev.team_kr || "총괄 본부장"} · ${ev.tool || ""}${ev.label ? " · " + ev.label : ""}${ev.site ? " · [" + ev.site + "]" : ""}`);
  } else if (k === "team_stop"){
    const s = agentSeat[ev.agent_id]; delete agentSeat[ev.agent_id];
    if (s){ s.agent = null; report(s); }
    setLog(`${st ? STATIONS[st].name : ""} · ${s ? s.name : ev.team} 작업 끝 · 본부장실 보고`);
  } else if (k === "memo"){
    if (ev.memo_type === "pt") loadBoard(true);
    else { if (ev.memo_type === "permission_prompt" || ev.memo_type === "idle_prompt") waitN++;
      memos.push({text:(ev.memo_type === "permission_prompt" ? "승인 요청 · " : ev.memo_type === "idle_prompt" ? "대기 · " : "알림 · ") + ev.label, type:"notice"}); memos = memos.slice(-3); }
    setLog("메모: " + ev.label); render();
  } else if (k === "rest"){
    // 지시 하나가 끝남: 가장 최근에 일한 1명이 대표로 보고, 나머지는 자리에서 쉰다. 다른 세션의 팀(에이전트)은 그대로 일한다
    const now = performance.now(), mine = seats.filter(s => s.state === "work" && (!s.agent || now - s.lastWork > 60000));
    const rep = mine.sort((a, b) => b.lastWork - a.lastWork)[0];
    for (const s of mine){ if (s === rep) continue; s.agent = null; setState(s, "idle", ""); }
    if (rep){ rep.agent = null; report(rep); }
    memos = memos.filter(m => m.type !== "notice"); setLog("작업 끝 · 보고"); render();
  } else if (k === "start" || k === "prompt"){
    BATCH++;
    if (k === "start"){ memos = []; setLog("세션 시작" + (ev.cwd ? " · " + ev.cwd : "")); } else { touchSite(ev.site, "", ""); bossSay("지시: " + clip(ev.label || "", 18)); setLog("본부장 지시 · " + (ev.label || "")); }
    render();
  }
}
async function poll(){
  try{
    const r = await fetch(`/poll?since=${lastSeq}`, {cache:"no-store"}); if (!r.ok) throw 0; const j = await r.json();
    if (connected !== true){ connected = true; $("st").textContent = "서버 연결됨"; $("st").className = "pill ok";
      if (firstPoll){ firstPoll = false; for (const ev of j.events) if (ev.kind === "work" && ev.site) touchSite(ev.site, STATIONS[ev.room] ? ev.room : "", ""); lastSeq = j.seq; j.events = []; } }
    for (const ev of j.events){ handle(ev); lastSeq = ev.id; }
    if (j.seq < lastSeq) lastSeq = 0;
  }catch(e){ if (connected !== false){ connected = false; $("st").textContent = "서버 연결 끊김"; $("st").className = "pill bad"; } }
  setTimeout(poll, connected ? 600 : 2500);
}

// ───────── 현황판 · PT 확정 · 다가오는 일정 ─────────
async function loadBoard(once){ try{ const r = await fetch("/sites", {cache:"no-store"}); if (r.ok){ const j = await r.json(); if (j.sites && j.sites.length) boardRows = j.sites; renderBoard(); } }catch(e){} if (once !== true) setTimeout(loadBoard, 60000); }
const WD = "일월화수목금토";
const ptWhen = r => { const [y,m,d] = r.pt_date.split("-").map(Number), dt = new Date(y, m-1, d); return `${m}.${String(d).padStart(2,"0")}(${WD[dt.getDay()]})${r.pt_time ? " " + r.pt_time : ""}`; };
function renderBoard(){
  const rows = boardRows.map(r => ({...r})); const seen = new Set(rows.map(r => r.site));
  for (const n in sites) if (!seen.has(n) && Date.now() - sites[n].t < SITE_STALE_MS && sites[n].stage) rows.push({site:n, name:n, due:"", dday:null, done:false, stage:""});
  const pts = rows.filter(r => r.pt_ok && r.pt_dday >= 0);
  $("ptbar").innerHTML = pts.map(r => `<div class="ptc${r.pt_dday <= 3 ? " near" : ""}"><span class="t">2차 PT 확정</span><span class="w">${esc(r.name)} &nbsp; ${esc(ptWhen(r))} &nbsp; ${esc(r.pt_place || "")}${r.pt_more ? `<small>${esc(r.pt_more)}</small>` : ""}</span><span class="d">${r.pt_dday === 0 ? "오늘 PT" : "D-" + r.pt_dday}</span></div>`).join("");
  $("rows").innerHTML = rows.filter(r => !(r.pt_ok && r.pt_dday >= 0)).map(r => {
    const s = sites[r.site] || {stage:"", t:0}, stale = !s.t || Date.now() - s.t > SITE_STALE_MS;
    const live = !r.done && !stale && s.stage && s.stage !== "pt", lv = live && s.stage === "mail" && r.stage !== "mail" ? "ready" : s.stage;
    const stage = live ? lv : (r.stage || (s.stage !== "pt" ? s.stage : "") || "analysis"), si = BOARD_ORDER.indexOf(stage);
    const urgent = r.dday !== null && r.dday <= 3 && !r.done;
    const dtxt = r.done ? "제출" : r.dday === null ? "—" : r.dday > 0 ? "D-" + r.dday : r.dday === 0 ? "D-DAY" : "지남";
    const pips = BOARD_ORDER.map((k, i) => { const c = BSTAGE(k).color;
      return i < si ? `<i class="past" style="background:${c}"></i>` : i === si ? `<i class="on${live ? " live" : ""}" style="background:${c}"></i>` : `<i></i>`; }).join("");
    return `<div class="row${r.done ? " done" : ""}${r.site === curSite ? " cur" : ""}" title="${esc(r.name || r.site)}"><span class="nm">${esc(r.site)}</span>`
      + `<span class="due">${esc((r.due || "—").split(" (")[0].split("까지")[0])}</span><span><em class="dd${r.done ? " done" : urgent ? " urgent" : ""}" style="font-style:normal">${dtxt}</em></span>`
      + `<span class="pips">${pips}</span><span class="pt${r.pt_date ? " has" : ""}">${esc(clip(r.pt || "—", 30))}</span></div>`; }).join("");
  const ev = [], today = new Date(); today.setHours(0,0,0,0);
  for (const r of rows){
    if (!r.done && r.dday !== null && r.dday >= 0) ev.push({d: r.dday, k:"마감", s:r.site, c:"#c9483b", f:"#fff"});
    if (r.pt_date){ const [y,m,d] = r.pt_date.split("-").map(Number), dd = Math.round((new Date(y, m-1, d) - today) / 864e5); if (dd >= 0) ev.push({d: dd, k: r.pt_ok ? "PT 확정" : "PT", s:r.site, c: r.pt_ok ? "#c9a45c" : "#6d5a30", f: r.pt_ok ? "#2a2210" : "#f2dca0"}); }
  }
  $("uplist").innerHTML = ev.sort((a, b) => a.d - b.d).map(e => { const dt = new Date(today); dt.setDate(dt.getDate() + e.d);
    return `<div class="ev"><span class="dt">${dt.getMonth()+1}.${String(dt.getDate()).padStart(2,"0")}(${WD[dt.getDay()]})</span><span class="k" style="background:${e.c};color:${e.f}">${e.k}</span><span class="s">${esc(e.s)}</span><span class="n${e.d <= 3 ? " u" : ""}">D-${e.d}</span></div>`; }).join("");
  ptCheck(pts);
}
const PT_DAYS = [3,2,1], ptShown = new Set();
function ptCheck(pts){
  const now = new Date(), h = now.getHours(), slot = h >= 16 ? 16 : h >= 10 ? 10 : 0; if (!slot) return;
  const today = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
  const due = pts.filter(r => PT_DAYS.includes(r.pt_dday)).filter(r => { const k = `pt:${r.site}:${r.pt_date}:${today}:${slot}`;
    if (ptShown.has(k)) return false; ptShown.add(k); try { if (localStorage.getItem(k)) return false; localStorage.setItem(k, "1"); } catch(e){} return true; });
  if (due.length) ptAlert(due);
}
function ptAlert(due){
  const a = $("ptalert");
  a.innerHTML = `<h2>🎤 2차 PT ${due.map(r => "D-" + r.pt_dday).join(" · ")}</h2>` + due.map(r => `<p><b>${esc(r.name)}</b> · <strong style="color:#ffd77a">${esc(ptWhen(r))}</strong> · ${esc(r.pt_place || "")}${r.pt_more ? " · " + esc(r.pt_more) : ""}</p>`).join("") + `<button type="button">확인</button>`;
  a.classList.add("on"); a.querySelector("button").onclick = () => a.classList.remove("on");
  for (const r of due){ memos.push({text:`PT D-${r.pt_dday} ${r.site} ${ptWhen(r).replace(/\(.\).*/, "")}`, type:"pt"}); } memos = memos.slice(-3); render();
  try { const ac = new AudioContext(), t = ac.currentTime; [784, 988, 1175].forEach((f,i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + i*0.18); g.gain.exponentialRampToValueAtTime(0.18, t + i*0.18 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.18 + 0.5);
    o.connect(g).connect(ac.destination); o.start(t + i*0.18); o.stop(t + i*0.18 + 0.55); }); } catch(e){}
  setLog("PT 알림 · " + due.map(r => `${r.name} ${ptWhen(r)}`).join(" · "));
}
