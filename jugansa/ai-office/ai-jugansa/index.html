<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 주관사업부 오피스</title>
<style>
  :root{--bg:#0b111b;--panel:#121a27;--fg:#ece5d6;--mut:#8f9bb0;--gold:#c8a35a;--ok:#7fd3a0;--bad:#ef8f7c;--line:rgba(255,255,255,.08)}
  html,body{height:100%;margin:0;background:radial-gradient(1200px 600px at 50% -10%,#18243a 0%,var(--bg) 60%);color:var(--fg);font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px;box-sizing:border-box}
  header{width:100%;max-width:1200px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;letter-spacing:.5px;font-weight:700}
  header h1 em{font-style:normal;color:var(--gold)}
  header h1 small{color:var(--mut);font-weight:400;margin-left:10px;font-size:12px}
  .st{padding:3px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:12px}
  .st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
  .sp{flex:1}
  button{background:transparent;color:var(--gold);border:1px solid rgba(200,163,90,.55);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  button:hover{background:rgba(200,163,90,.12)}
  #wrap{--k:1;width:100%;max-width:1200px;aspect-ratio:1200/720;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px var(--line)}
  canvas{width:100%;height:100%;display:block}
  #log{width:100%;max-width:1200px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 단지 보드 — 캔버스 위 HTML (오른쪽 스크롤 · 한 줄 행) */
  #board{position:absolute;left:4.333%;top:41.944%;width:59.667%;height:53.611%;display:flex;flex-direction:column;font-size:calc(12px*var(--k));color:#e9e3d6}
  #board .bh{display:flex;align-items:baseline;gap:calc(8px*var(--k));padding:0 calc(6px*var(--k)) calc(6px*var(--k))}
  #board .bh b{font-size:calc(14px*var(--k));letter-spacing:.3px}
  #board .bh span{color:var(--mut);font-size:calc(11px*var(--k))}
  #board .bh i{margin-left:auto;font-style:normal;color:var(--mut);font-size:calc(10.5px*var(--k))}
  #board .row{display:grid;grid-template-columns:2.3fr 1.35fr .95fr 2.6fr 1.15fr;align-items:center;column-gap:calc(6px*var(--k));height:calc(25px*var(--k));padding:0 calc(8px*var(--k));border-radius:calc(6px*var(--k));white-space:nowrap}
  #board .row>span{overflow:hidden;text-overflow:ellipsis}
  #board .head{height:calc(20px*var(--k));color:var(--mut);font-size:calc(10.5px*var(--k));border-bottom:1px solid var(--line);border-radius:0;margin-right:calc(10px*var(--k))}
  #rows{flex:1;overflow-y:auto;scrollbar-gutter:stable;padding-top:calc(3px*var(--k));display:flex;flex-direction:column;gap:calc(2px*var(--k))}
  #rows::-webkit-scrollbar{width:calc(8px*var(--k))}
  #rows::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
  #rows::-webkit-scrollbar-thumb{background:rgba(200,163,90,.55);border-radius:99px}
  #rows{scrollbar-color:rgba(200,163,90,.55) rgba(255,255,255,.04);scrollbar-width:thin}
  #rows .row{background:rgba(255,255,255,.035)}
  #rows .row:hover{background:rgba(255,255,255,.07)}
  #rows .row.urgent{background:rgba(239,143,124,.11)}
  #rows .row.cur{background:rgba(200,163,90,.13);box-shadow:inset calc(3px*var(--k)) 0 0 var(--gold)}
  #rows .row.done{opacity:.5}
  #rows .nm b{font-weight:700;margin-right:calc(5px*var(--k))}
  #rows .nm small{color:var(--mut);font-size:calc(10.5px*var(--k))}
  #rows .due{font-variant-numeric:tabular-nums;color:#d8d0c0}
  .dd{display:inline-block;min-width:calc(42px*var(--k));text-align:center;font:700 calc(11px*var(--k))/1.6 ui-monospace,Consolas,monospace;border-radius:99px;background:rgba(255,255,255,.07)}
  .dd.urgent{background:#5b2019;color:#ffb3a3;animation:blink 1s steps(2,start) infinite}
  .dd.done{background:#163828;color:var(--ok)}
  .dd.soon{background:rgba(200,163,90,.18);color:#f0d49a}
  @keyframes blink{to{background:#8a2a1f}}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center;align-items:center}
  .dots i{display:block;width:calc(6px*var(--k));height:calc(6px*var(--k));border-radius:50%;background:#3a4558}
  .dots i.on{width:calc(11px*var(--k));height:calc(11px*var(--k));box-shadow:0 0 calc(8px*var(--k)) currentColor}
  .dots i.live{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.35)}}
  .head .dots span{font-size:calc(9.5px*var(--k))}
  #rows .pt{color:var(--mut);font-size:calc(11px*var(--k))}
  #rows .empty{color:var(--mut);padding:calc(10px*var(--k))}
</style>
</head>
<body>
<header>
  <h1><em>AI</em> 주관사업부 오피스 <small>엣지컴퍼니 · 입주박람회 주관사 입찰 · 오픈 플로어</small></h1>
  <span id="st" class="st">서버 확인 중</span>
  <span class="sp"></span>
  <button id="simBtn">시뮬레이션 시작</button>

</header>
<div id="wrap">

    <div class="bh"><b>진행 중 단지</b><span>마감 D-day · 지금 단계</span><i id="bcount"></i></div>

  </section>
</div>
<div id="log">·</div>

<script>
// ───────── 오픈 플로어 배치 ─────────

const ORDER = ["scout","analysis","build","audit","mail","pt","retro"];
const ST_Y = 150, ST_X0 = 60, ST_GAP = 136;          // 작업대 줄 (y = 캐릭터 발 위치)
ORDER.forEach((k,i)=>{ STATIONS[k].x = ST_X0 + i*ST_GAP; STATIONS[k].y = ST_Y; });
const BOSS_DESK = {x:1085, y:150};                     // 본부장 책상
const BOARD = {box:[40,290,780,700]};                 // 단지 보드 (내용은 HTML #board)
const LOUNGE = {box:[840,290,1160,520], seats:[[930,478],[1000,478],[1070,478]]};   // 휴게 코너 (본부장 휴식)
const ENTRY = {box:[840,540,1160,700]}, DOOR = [1000, 700];   // 출입구: 팀은 여기로 들어와 작업대로 가고, 끝나면 여기로 나간다
const WALK_Y = 240, CORR_X = 810;                     // 작업대 ↔ 아래 영역 통로 · 보드와 휴게 코너 사이 복도
const PS = 0.9, WALK_SPEED = 150;                     // 사람 그림 배율
const SITE_STALE_MS = 30*60*1000;

// ───────── 도우미 ─────────
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function ell(g,x,y,rx,ry,rot=0){ g.beginPath(); g.ellipse(x,y,rx,ry,rot,0,Math.PI*2); }
function tri(g,a,b,c,d,e,f){ g.beginPath(); g.moveTo(a,b); g.lineTo(c,d); g.lineTo(e,f); g.closePath(); g.fill(); }
function line(g,a,b,c,d){ g.beginPath(); g.moveTo(a,b); g.lineTo(c,d); g.stroke(); }
function shade(hex,a){ const n=parseInt(hex.slice(1),16); let r=n>>16,gg=n>>8&255,b=n&255; const t=a<0?0:255,p=Math.abs(a); r=Math.round(r+(t-r)*p); gg=Math.round(gg+(t-gg)*p); b=Math.round(b+(t-b)*p); return `rgb(${r},${gg},${b})`; }
function hash(s){ let h=2166136261; for (const ch of String(s)) { h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=hash(seed); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function fitText(g,text,x,y,maxW,size,weight="400"){ let s=size; do { g.font=`${weight} ${s}px 'Malgun Gothic', sans-serif`; } while (g.measureText(text).width > maxW && (s-=0.5) > 7); g.fillText(text,x,y); }
function clip(s, n){ s = String(s); return s.length > n ? s.slice(0, n-1) + "…" : s; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ───────── 사람(캐릭터) — 팀마다 여러 명이 있고, 호출될 때마다 그중 한 명이 나온다 ─────────
const SKIN = ["#f8dfca","#f2cfb3","#ebc19f","#ddab84","#c98f66","#a8704c"];
const HAIR_N = ["#1d1b22","#2c221d","#3f2c21","#5b3c27","#7a5134","#a07446","#4a4a52"];
const HAIR_D = ["#c9b08a","#8a3b3b","#3a5f8f","#6b4e9b","#d8d2c8","#b06a4a"];
const SHIRT = ["#f6f7f9","#dfe9f5","#f3ece0","#e8eef0"];
const BLAZER = ["#1f2a44","#2f3b52","#3b2f2f","#4a4a52","#24423c","#5a2e3a","#6b5a48","#c9c3b6"];
const HOODIE = ["#e2a03f","#5f8fd6","#6fbf9a","#d97a8b","#8e7cc3","#3b3f4a","#e9e4d8"];
const KNIT = ["#c96f53","#e8d3a9","#6d8b74","#9c8bd6","#384a6b","#b8574f","#d9c7e8"];
const CARD = ["#8b6f5a","#2f4858","#b5651d","#6c757d","#7a8b5a"];
const TIE = ["#c8a35a","#a33a2a","#2e5aa8","#4a7d4f","#6a3a8a","#1f2a44"];
const PANTS = ["#2b2f3a","#3a3f4b","#4a3b2f","#1f2533","#6b6f78","#3d4a5c","#c8b89a","#5a4a3a"];
const SKIRT = ["#2b2f3a","#5a3a4a","#3d4a5c","#8a6a4a","#6b4e9b","#c8b89a"];
const SHOES = ["#1c1c22","#5a3b28","#ecebe8","#3a3a42","#7a2e2e"];
const LANYARD = ["#c8a35a","#2e5aa8","#a33a2a","#2f7a5a"];
const ACC = ["#c8a35a","#e07a7a","#6fa3e8","#7fd38a","#c39ae8"];
function genLook(seed){
  const R = rng(seed), pick = a => a[Math.floor(R()*a.length)];
  const hs = pick([0,0,1,1,2,3,3,4,5,6,7,8]), long = [2,3,4,5].includes(hs);
  const ts = pick([0,1,1,2,3,4]);
  const top = ts===0 ? pick(SHIRT) : ts===1 ? pick(BLAZER) : ts===2 ? pick(HOODIE) : ts===3 ? pick(KNIT) : pick(CARD);
  const skin = pick(SKIN), skirt = long && R() < 0.5;
  return {key:seed, skin, hair: pick(R()<0.78 ? HAIR_N : HAIR_D), hs, ts, top,
    inner: pick(["#ffffff","#ffffff","#f3ece0","#dfe9f5","#1f2533"]), tie: (ts===0 || (ts===1 && R()<0.45)) ? pick(TIE) : null,
    pants: skirt ? pick(SKIRT) : pick(PANTS), skirt, legs: pick(["#2b2b33", skin, "#3a3340"]), shoes: pick(SHOES),
    glasses: R() < 0.3, glassesColor: pick(["#2b2b33","#7a5230","#9aa3ad","#c8a35a"]), headset: R() < 0.12,
    lanyard: R() < 0.45 ? pick(LANYARD) : null, prop: pick([null,null,"laptop","tablet","docs","coffee"]), acc: pick(ACC)};
}
const BOSS_LOOK = {key:"boss", skin:"#f2cfb3", hair:"#1d1b22", hs:1, ts:1, top:"#14223a", inner:"#ffffff", tie:"#c8a35a", pants:"#14223a", skirt:false,
  legs:"#14223a", shoes:"#1c1c22", glasses:true, glassesColor:"#c8a35a", headset:false, lanyard:null, prop:"tablet", acc:"#c8a35a"};
const ROSTERS = {};
function pickLook(team){
  const roster = ROSTERS[team] || (ROSTERS[team] = Array.from({length:5}, (_,i) => genLook(team + "#" + i)));
  const used = new Set(Object.values(chars).map(c => c.look.key));
  const free = roster.filter(l => !used.has(l.key));
  return free.length ? free[Math.floor(Math.random()*free.length)] : genLook(team + "#" + Math.random());
}
function arm(g,x,y,a,c,skin){ g.save(); g.translate(x,y); g.rotate(a); g.fillStyle=c; rr(g,-3.6,-1,7.2,17,3.6); g.fill(); g.fillStyle=shade(c,-0.12); rr(g,-3.6,12.5,7.2,3,1.5); g.fill(); g.fillStyle=skin; ell(g,0,17.6,3.4,3.4); g.fill(); g.restore(); }
function hairFront(g,P){
  g.fillStyle = P.hair;
  const cap = pts => { g.beginPath(); g.moveTo(12.6,31); g.bezierCurveTo(10,-1,54,-1,51.4,31); for (const [x,y] of pts) g.lineTo(x,y); g.closePath(); g.fill(); };
  switch (P.hs){
    case 0: cap([[48,22],[43,25.5],[38,21.5],[32,25.5],[26,21.5],[21,25.5],[16,22]]); break;
    case 1: cap([[49.5,21],[42,22.5],[33,19.5],[24,23.5],[17.5,29.5]]); break;
    case 2: cap([[48.5,23.5],[15.5,23.5]]); rr(g,11,24,7.5,22,3.5); g.fill(); rr(g,45.5,24,7.5,22,3.5); g.fill(); break;
    case 3: cap([[47,21],[38,20],[28,22.5],[18,27]]); rr(g,10.8,24,6.5,33,3.2); g.fill(); rr(g,46.7,24,6.5,33,3.2); g.fill(); break;
    case 4: cap([[47,21.5],[36,19.5],[25,22],[16,25.5]]); break;
    case 5: cap([[47,22.5],[40,24],[32,21.5],[24,24],[17,22.5]]); break;
    case 6: cap([[46,24],[39,22],[32,24.5],[25,22],[18,24]]); for (let a=Math.PI*0.95; a<=Math.PI*2.05; a+=Math.PI/8){ ell(g,32+19.5*Math.cos(a),27+18*Math.sin(a),5,5); g.fill(); } break;
    case 7: g.beginPath(); g.moveTo(13.2,27); g.bezierCurveTo(11,2,53,2,50.8,27); g.lineTo(46,20.5); g.lineTo(18,20.5); g.closePath(); g.fill(); break;
    case 8: ell(g,31,10,16,7.5,-0.08); g.fill(); cap([[49,22],[40,20.5],[30,22],[20,21],[15.5,26]]); break;
  }
  g.strokeStyle = "rgba(255,255,255,.26)"; g.lineWidth = 1.6; g.lineCap = "round"; g.beginPath(); g.arc(30,22,12,Math.PI*1.18,Math.PI*1.42); g.stroke();
}
function drawProp(g,P){
  switch (P.prop){
    case "laptop": g.fillStyle="#cfd4dc"; rr(g,33.5,57,15,10,1.6); g.fill(); g.fillStyle="#aeb4be"; g.fillRect(33.5,65.5,15,1.5); g.fillStyle="#fff"; ell(g,41,61.5,1.3,1.3); g.fill(); break;
    case "tablet": g.fillStyle="#232833"; rr(g,35,54,11,15,2); g.fill(); g.fillStyle="#7fb2e6"; rr(g,36.2,55.4,8.6,12,1.2); g.fill(); g.fillStyle="rgba(255,255,255,.65)"; g.fillRect(37.5,57.5,5,1); g.fillRect(37.5,60,6,1); break;
    case "docs": g.fillStyle="#e9e2d0"; rr(g,34,55.5,12,15,1.2); g.fill(); g.fillStyle="#fffdf8"; rr(g,35,54.5,12,15,1.2); g.fill(); g.fillStyle="#b9b2a2"; for (let i=0;i<4;i++) g.fillRect(37,58+i*2.6,7.5,0.8); g.fillStyle=P.acc; g.fillRect(39,53.5,4,2); break;
    case "coffee": g.fillStyle="#f4efe6"; rr(g,38.5,58,7,9.5,1.5); g.fill(); g.fillStyle="#8a5a3a"; g.fillRect(38.5,61,7,3.2); g.fillStyle="#3b3f4a"; rr(g,38,57,8,2,1); g.fill(); break;
  }
}
function drawPerson(g, P, f){
  const s = f===0 ? 0 : (f===1 ? 1 : -1);
  // 뒷머리
  if (P.hs===3){ g.fillStyle=P.hair; rr(g,12.5,22,39,42,14); g.fill(); }
  if (P.hs===4){ g.fillStyle=P.hair; ell(g,50,38,5.5,12,0.35); g.fill(); g.fillStyle=P.acc; ell(g,47.5,27.5,2.6,2.6); g.fill(); }
  if (P.hs===5){ g.fillStyle=P.hair; ell(g,32,7.5,7.5,7); g.fill(); }
  // 다리 · 신발
  const lx = 24.5 + s*2.4, rx = 32.5 - s*2.4, ly = 70, lhL = 20 - (s<0?1.6:0), lhR = 20 - (s>0?1.6:0);
  g.fillStyle = P.skirt ? P.legs : P.pants; rr(g,lx,ly,7,lhL,3); g.fill(); rr(g,rx,ly,7,lhR,3); g.fill();
  if (!P.skirt){ g.fillStyle = shade(P.pants,-0.18); g.fillRect(lx+3.2,ly+3,0.7,lhL-6); g.fillRect(rx+3.2,ly+3,0.7,lhR-6); }
  g.fillStyle = P.shoes; ell(g,lx+3,ly+lhL,5,2.8); g.fill(); ell(g,rx+4,ly+lhR,5,2.8); g.fill();
  // 목 · 몸통
  g.fillStyle = shade(P.skin,-0.1); rr(g,28.5,44,7,7,2); g.fill();
  g.fillStyle = P.top; rr(g,19,48,26,25,9); g.fill();
  g.fillStyle = "rgba(255,255,255,.08)"; rr(g,21,49,9,20,5); g.fill();
  if (P.skirt){ g.fillStyle=P.pants; g.beginPath(); g.moveTo(20,65); g.lineTo(44,65); g.lineTo(47.5,80); g.lineTo(16.5,80); g.closePath(); g.fill(); g.fillStyle=shade(P.pants,-0.2); g.fillRect(20,65,24,1.6); }
  else { g.fillStyle=P.pants; rr(g,19.5,66,25,8,3); g.fill(); g.fillStyle=shade(P.pants,-0.35); g.fillRect(19.5,66,25,1.8); }
  // 옷 디테일
  const T = P.top, tie = (y2) => { g.fillStyle=P.tie; ell(g,32,50.8,2,1.7); g.fill(); rr(g,30.7,51.5,2.6,y2-51.5,1); g.fill(); tri(g,30.7,y2,33.3,y2,32,y2+2); };
  g.lineCap = "round";

// ───────── 단지 보드 (HTML · 한 줄 행 · 오른쪽 스크롤) ─────────
const STAGE_SHORT = {scout:"개척", analysis:"착수", build:"제작", audit:"검증", mail:"발송", pt:"PT", retro:"관제"};
document.getElementById("dhead").innerHTML = ORDER.map(k => `<span>${STAGE_SHORT[k]}</span>`).join("");
function renderBoard(){
  const rows = boardRows.map(r => ({...r})); const seen = new Set(rows.map(r => r.site));
  for (const n in sites) if (!seen.has(n)) rows.push({site:n, name:n, due:"", dday:null, done:false});
  const box = document.getElementById("rows");
  document.getElementById("bcount").textContent = rows.length ? `${rows.filter(r=>!r.done).length}곳 진행 · ${rows.filter(r=>r.done).length}곳 제출` : "";
  if (!rows.length){ box.innerHTML = `<div class="empty">현황판(jugansa/입찰현황판.md)을 아직 못 찾음 — 세션을 시작하면 읽습니다</div>`; return; }
  box.innerHTML = rows.map(r => {
    const s = sites[r.site] || {stage:"", t:0, teams:[]}, stale = !s.t || Date.now() - s.t > SITE_STALE_MS, cur = r.site === curSite;
    // 불 켜지는 칸 = 마지막 단계 (방금 신호가 온 단계 → 없으면 현황판 '단계' 표)
    const live = !stale && s.stage, stage = live ? s.stage : (r.stage || s.stage), si = ORDER.indexOf(stage);
    const urgent = r.dday !== null && r.dday <= 2 && !r.done, soon = r.dday !== null && r.dday <= 7 && !r.done && !urgent;
    const short = String(r.site).replace(/\s*\(.*$/, "").trim() || r.site;
    const full = String(r.name || "").replace(/\s*\(.*$/, "");
    const due = (r.due || "—").replace(/\s*\(.*$/, "") + (r.time ? " " + r.time : "");
    const dtxt = r.done ? "제출" : r.dday === null ? "—" : r.dday > 0 ? "D-" + r.dday : r.dday === 0 ? "D-DAY" : "지남";
    const ptm = r.pt ? (r.pt.match(/\d{1,2}\.\d{1,2}/) || [""])[0] : "";
    const pt = ptm ? ptm + (r.pt_dday !== null && r.pt_dday >= 0 ? ` · D-${r.pt_dday}` : "") : "—";
    const dots = ORDER.map((k,i) => { const on = i === si;
      return `<i class="${on ? "on" + (live ? " live" : "") : ""}" style="${on ? `background:${STATIONS[k].color};color:${STATIONS[k].color}` : ""}" title="${STATIONS[k].name}"></i>`; }).join("");
    const title = `${r.name || r.site}${r.due ? " · 마감 " + r.due : ""}${r.pt ? " · PT " + r.pt : ""}${s.teams.length ? " · " + s.teams.join(", ") : ""}`;
    return `<div class="row${r.done ? " done" : ""}${cur ? " cur" : ""}${urgent ? " urgent" : ""}" title="${esc(title)}">`

      + `<span class="due">${esc(due)}</span>`
      + `<span><em class="dd${r.done ? " done" : urgent ? " urgent" : soon ? " soon" : ""}" style="font-style:normal">${dtxt}</em></span>`

}

// ───────── 그리기 루프 ─────────
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let last = performance.now();
function tick(now){ const dt = Math.min(0.05,(now-last)/1000); last = now;
  for (const id in chars){ const ch = chars[id]; move(ch, dt);
    if (id !== "boss" && ch.leaveAt && now > ch.leaveAt && ch.state !== "leaving" && !ch.path.length){ ch.state = "leaving"; go(ch, [DOOR[0] - 20 + Math.random()*40, DOOR[1] + 6], "exit"); ch.after = ()=>{ delete chars[id]; }; }
  }
  draw(now); requestAnimationFrame(tick); }
function move(ch, dt){
  if (ch.path.length){ const [tx,ty] = ch.path[0]; const dx=tx-ch.x, dy=ty-ch.y, d=Math.hypot(dx,dy), step=WALK_SPEED*dt;
    if (Math.abs(dx) > 1) ch.face = dx > 0 ? 1 : -1;
    if (d <= step){ ch.x=tx; ch.y=ty; ch.path.shift(); if (!ch.path.length){ ch.hop = 1; if (ch.after){ const f=ch.after; ch.after=null; f(); } } }
    else { ch.x += dx/d*step; ch.y += dy/d*step; } }

let lastChat = 0;
function draw(now){

    ctx.fillStyle="#f3dfb0"; ctx.font="600 11.5px 'Malgun Gothic', sans-serif"; ctx.fillText(clip(m.text, 15), x+22, y+18); });

    const bob = walking ? Math.abs(Math.sin(now/170*Math.PI/2))*1.5 : (ch.state==="working" ? Math.sin(now/260)*1.2 : 0);
    const hop = ch.hop > 0 ? Math.sin(ch.hop*Math.PI)*7 : 0;
    const x = ch.x - W/2, y = ch.y + 12 - H - bob - hop;
    ctx.fillStyle = "rgba(0,0,0,.32)"; ell(ctx, ch.x, ch.y + 10, 14 - hop*0.6, 4); ctx.fill();
    ctx.save(); if (ch.face < 0){ ctx.translate(ch.x,0); ctx.scale(-1,1); ctx.translate(-ch.x,0); } ctx.drawImage(img, x, y, W, H); ctx.restore();
    const col = ch.state==="working" ? "#6fd37a" : ch.state==="reporting" ? "#f2c14e" : ch.state==="resting" ? "#8fb4e8" : ch.state==="leaving" ? "#8a93a3" : "#d8d2c4";
    ctx.save(); if (ch.state==="working"){ ctx.shadowColor = col; ctx.shadowBlur = 8; } ctx.fillStyle = col; ell(ctx, ch.x + 15, y + 9, 4, 4); ctx.fill(); ctx.restore();
    ctx.strokeStyle="rgba(10,15,24,.9)"; ctx.lineWidth=1.2; ell(ctx, ch.x + 15, y + 9, 4, 4); ctx.stroke();

function pill(cx, by, text, fg, bgc, border, tail){ ctx.font = "600 11.5px 'Malgun Gothic', sans-serif"; const t = clip(text, 24), w = ctx.measureText(t).width + 16, h = 19, x = Math.min(1200-w-4, Math.max(4, cx - w/2)), y = by - h - (tail ? 4 : 0);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.fillStyle = bgc; rr(ctx, x, y, w, h, 9.5); ctx.fill();
  if (tail){ ctx.beginPath(); ctx.moveTo(cx-4, y+h-1); ctx.lineTo(cx, y+h+4); ctx.lineTo(cx+4, y+h-1); ctx.closePath(); ctx.fill(); } ctx.restore();
  if (border){ ctx.strokeStyle = border; ctx.lineWidth = 1; rr(ctx, x+.5, y+.5, w-1, h-1, 9); ctx.stroke(); }
  ctx.fillStyle = fg; ctx.fillText(t, x+8, y+13.5); return y; }
function nameplate(cx, by, text, col){ ctx.font = "600 10.5px 'Malgun Gothic', sans-serif"; const t = clip(text, 12), w = ctx.measureText(t).width + 18, x = cx - w/2;
  ctx.fillStyle = "rgba(10,15,24,.86)"; rr(ctx, x, by, w, 15, 7.5); ctx.fill(); ctx.fillStyle = col; ell(ctx, x + 7, by + 7.5, 2.6, 2.6); ctx.fill();
  ctx.fillStyle = "#ece5d6"; ctx.fillText(t, x + 12, by + 11); }
cv.addEventListener("click", e => { const r = cv.getBoundingClientRect(), pxx = (e.clientX - r.left) * 1200 / r.width, pyy = (e.clientY - r.top) * 720 / r.height;
  for (const id in chars){ const ch = chars[id], b = ch._box; if (!b) continue; if (pxx >= b[0] && pxx <= b[0]+b[2] && pyy >= b[1] && pyy <= b[1]+b[3]){
    say(ch, ch.state==="working" ? "[작업 중] " + (ch.label || ch.tag || "") : ch.state==="reporting" ? "[보고 중]" : ch.state==="resting" ? "[휴식 중]" : ch.state==="leaving" ? "[퇴근]" : "[대기 중]"); return; } } });
