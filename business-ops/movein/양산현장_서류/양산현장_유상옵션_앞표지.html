<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>양산현장 · 입주 유상옵션 안내 (앞표지)</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family:'Malgun Gothic','맑은 고딕',sans-serif; margin:0; background:#eceef1; }
.page { width:210mm; height:297mm; position:relative; background:#0f1a2e; margin:0 auto; overflow:hidden; color:#fff; }
.bgtop { position:absolute; inset:0; background:
  radial-gradient(1200px 600px at 80% -10%, rgba(201,162,39,.22), transparent 60%),
  linear-gradient(180deg,#101d34 0%,#0f1a2e 55%,#0b1424 100%); }
.frame { position:absolute; inset:14mm; border:1px solid rgba(201,162,39,.45); }
.inner { position:relative; height:100%; padding:26mm 22mm; display:flex; flex-direction:column; }
.brand { font-size:15px; font-weight:800; letter-spacing:5px; color:#e9d9a6; }
.brand small { display:block; font-size:10px; font-weight:600; letter-spacing:3px; color:#9fb0c6; margin-top:5px; }
.rule { width:54px; height:3px; background:#c9a227; margin:18px 0 0; }
.apt { margin-top:40px; font-size:17px; font-weight:700; letter-spacing:3px; color:#cdd8e8; }
h1 { margin:12px 0 0; font-size:50px; font-weight:800; letter-spacing:4px; line-height:1.25; color:#fff; }
h1 .g { color:#e9d9a6; }
.eng { margin-top:16px; font-size:12px; letter-spacing:6px; color:#8ea0b8; font-weight:600; }
.gift { margin-top:30px; display:inline-flex; align-items:center; gap:12px; align-self:flex-start;
  background:rgba(201,162,39,.14); border:1px solid rgba(201,162,39,.5); border-radius:40px; padding:11px 20px; }
.gift .t { font-size:11px; font-weight:800; color:#0f1a2e; background:#e9d9a6; border-radius:20px; padding:3px 11px; letter-spacing:1px; }
.gift .m { font-size:13px; font-weight:700; color:#f1e6c4; }
.spacer { flex:1; }
.meta { border-top:1px solid rgba(255,255,255,.15); padding-top:18px; display:flex; justify-content:space-between; gap:24px; }
.meta .col { font-size:12.5px; line-height:1.9; color:#cdd8e8; }
.meta .col b { color:#e9d9a6; font-weight:700; letter-spacing:1px; }
.host { margin-top:22px; font-size:12px; color:#9fb0c6; letter-spacing:1px; }
.host b { color:#fff; font-weight:800; letter-spacing:2px; }
</style></head>
<body>
<div class="page">
  <div class="bgtop"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="brand">EDGE COMPANY<small>㈜엣지컴퍼니 · 입주품목 옵션 및 박람회 전문기획</small></div>
    <div class="rule"></div>

    <div class="apt">양산현장</div>
    <h1>입주 <span class="g">유상옵션</span><br>계약 안내</h1>
    <div class="eng">PREMIUM OPTION GUIDE</div>

    <div class="gift">
      <span class="t">방문 사은품</span>
      <span class="m">옵션행사장 방문 고객 전원 · 5만원 상당 라면포트기 증정</span>
    </div>

    <div class="spacer"></div>

    <div class="meta">
      <div class="col">
        <b>옵션행사 일정</b><br>2026. 7. 22(수) ~ 7. 25(토) · 4일간
      </div>
      <div class="col">
        <b>행사 장소</b><br>양산현장 모델하우스
      </div>
      <div class="col">
        <b>대상 평형</b><br>59㎡ · 76㎡ · 84㎡A · 84㎡B
      </div>
    </div>

    <div class="host">주관 · <b>㈜ 엣 지 컴 퍼 니</b> &nbsp;|&nbsp; 계약·수납·A/S 보증</div>
  </div>
</div>
</body></html>
