    <linearGradient id="l-pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f6fa"/><stop offset=".5" stop-color="#d6dde8"/><stop offset="1" stop-color="#a7b3c4"/></linearGradient>
