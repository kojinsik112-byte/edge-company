<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="k-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#e6eefb"/></linearGradient>
    <linearGradient id="k-chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3ccd8"/><stop offset=".35" stop-color="#f2f6fa"/><stop offset=".55" stop-color="#d6dde8"/><stop offset="1" stop-color="#a7b3c4"/></linearGradient>
    <linearGradient id="k-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcdcfb" stop-opacity=".95"/><stop offset="1" stop-color="#1f83e0" stop-opacity=".7"/></linearGradient>
    <linearGradient id="k-counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fafb"/><stop offset="1" stop-color="#e0ebf1"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#k-wall)"/>
  <!-- 타일 -->
