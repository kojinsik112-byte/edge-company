  <path d="M723 360 C723 260 600 260 600 430" fill="none" stroke="url(#k-chrome)" stroke-width="24" stroke-linecap="round"/>
  <rect x="585" y="424" width="32" height="22" rx="8" fill="url(#k-chrome)"/>
  <rect x="592" y="446" width="18" height="76" rx="9" fill="url(#k-water)"/>
