<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Pretendard",system-ui,sans-serif}
  :root{--teal:#2f9aa6;--ink:#1d2733;--muted:#6f7d92}
  body{width:1080px;height:430px;background:
      radial-gradient(700px 380px at 88% 20%, rgba(58,160,168,.14), transparent 60%),
      linear-gradient(180deg,#ffffff,#f2f9fa);
    padding:46px 54px;color:var(--ink);position:relative;overflow:hidden}
  .tag{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(90deg,#2f9aa6,#3aa0a8);padding:8px 16px;border-radius:999px}
  h1{font-size:54px;font-weight:800;letter-spacing:-.03em;margin-top:18px;line-height:1.18}
  h1 b{color:var(--teal)}
  .sub{font-size:19px;color:var(--muted);margin-top:14px;font-weight:600}
  .row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .b{font-size:15px;font-weight:700;color:var(--teal);background:rgba(58,160,168,.09);border:1px solid rgba(58,160,168,.22);border-radius:999px;padding:9px 16px}
  .cond{position:absolute;left:54px;bottom:30px;font-size:13px;color:var(--muted)}
  .gift{position:absolute;right:60px;top:120px;width:230px;height:230px;border-radius:28px;
    background:linear-gradient(160deg,#3aa0a8,#2f7f8a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 24px 50px rgba(47,127,138,.32)}
  .gift .em{font-size:74px}
  .gift .t{font-size:21px;font-weight:800;margin-top:6px}
  .gift .s{font-size:13px;opacity:.9;margin-top:2px}
</style></head><body>
  <span class="tag">🎁 런칭 한정 혜택</span>
  <h1>리뷰 쓰면 <b>조명키트 증정</b><br>지금 아크로 실링팬</h1>
  <div class="sub">309,000원 · 블루투스 앱 제어 · BLDC 무소음 · 5년 A/S</div>
  <div class="row">
    <span class="b">실링팬 + 조명을 한 앱으로</span>
    <span class="b">5년 A/S 안심</span>
    <span class="b">132cm 거실·안방</span>
  </div>
  <div class="gift"><div class="em">🎁</div><div class="t">조명키트</div><div class="s">리뷰 작성 시 증정</div></div>
  <div class="cond">※ 선착순/리뷰 작성 고객 대상, 소진 시 조기 종료. 사은품 실제 제공·조건 명시(표시광고법 준수).</div>
</body></html>
