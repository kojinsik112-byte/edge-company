\r
원칙: 합법 벤치마킹(복제 금지)·과대광고 금지(수치)·표시광고법/전안법(KC)·가짜후기 금지·키는 .env만·**회장에게 결론부터**. 미끼→생태계 락인 관점 유지. 시작 시 team_status로 working/studying, 끝나면 done(관제실 가시성).\r
