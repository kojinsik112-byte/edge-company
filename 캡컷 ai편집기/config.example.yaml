# autoedit 설정 파일 — 필요한 값만 바꿔 쓰면 됩니다.
silence:
  enabled: true
  noise_db: -30.0      # 이보다 조용하면 무음으로 간주
  min_silence: 0.6     # 잘라낼 무음 최소 길이(초)
  keep_pad: 0.15       # 말 앞뒤로 남길 여유(초)

subtitle:
  enabled: true
  model: base          # tiny / base / small / medium / large-v3 (클수록 정확하지만 느림)
  language: ko
  burn_in: true        # 영상에 자막 굽기
  font: Malgun Gothic  # 한국어 Windows 기본 한글 폰트
  # 아래 크기 값은 모두 "실제 픽셀" 단위(본편 1920x1080 기준)
  font_size: 48        # 본편 자막 글자 크기(px)
  outline: 3           # 외곽선 두께(px)
  margin_v: 60         # 화면 하단 여백(px)
  max_line_chars: 28   # 한 줄 최대 글자수(넘으면 줄바꿈)

shorts:
  enabled: true
  count: 3             # 만들 숏츠 개수
  min_duration: 20
  max_duration: 58
  # 세로 숏츠(1080x1920)용 자막 — 키우면 양옆이 짤리니 주의(픽셀 단위)
  font_size: 56        # 숏츠 자막 글자 크기(px)
  margin_v: 220        # 자막 하단 여백(px)
  max_line_chars: 16   # 좁은 세로 화면에 맞춰 한 줄을 짧게

branding:
  enabled: true
  intro: intro.mp4     # assets/ 폴더 기준 상대경로 (없으면 자동 건너뜀)
  outro: outro.mp4
  bgm: bgm.mp3
  bgm_volume: 0.12

output:
  width: 1920
  height: 1080
  fps: 30
  crf: 22              # 화질(낮을수록 고화질)
  preset: veryfast     # 인코딩 속도(veryfast=빠름, medium/slow=고화질·느림)
