[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "유튜브 영상 자동 편집기 — 무음 컷 / 자막 / 숏츠 / 인트로·아웃트로·BGM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autoedit = "autoedit.cli:main"

[tool.setuptools]
packages = ["autoedit"]
